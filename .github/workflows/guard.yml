name: Guard My Profile
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        run: |
          TIME=$(date -u -d "+5 hours +45 minutes" +"%Y-%m-%d %H:%M:%S")
          # This version ONLY appends to the bottom, it cannot delete anything!
          echo -e "\n#### 🕒 Verified Original Design: Nirmal Kharal | Updated: $TIME" >> README.md
      - name: Save Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Guard-Bot"
          git add README.md
          git commit -m "Guard-Bot: Ownership Verified" || echo "No changes"
          git push
