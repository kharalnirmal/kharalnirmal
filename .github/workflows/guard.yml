name: Guard My Profile
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Ownership to Bottom
        run: |
          TIME=$(date -u -d "+5 hours +45 minutes" +"%Y-%m-%d %H:%M:%S")
          TEXT="#### 🕒 Verified Original Design: Nirmal Kharal | Updated: $TIME"
          # The '>>' tells the computer: "Just add this to the very last line"
          echo -e "\n---\n$TEXT" >> README.md
      - name: Save Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Guard-Bot"
          git add README.md
          git commit -m "Guard-Bot: Ownership Verified" || echo "No changes"
          git push
