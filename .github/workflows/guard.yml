name: Guard My Profile
on:
  workflow_dispatch: 
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Timestamp
        run: |
          TIME=$(date -u -d "+5 hours +45 minutes" +"%Y-%m-%d %H:%M:%S")
          TEXT="#### 🕒 Verified Original Design: Nirmal Kharal | Updated: $TIME"
          # This 'sed' command is the safest version possible
          sed -i "s|TIMESTAMP_HERE|$TEXT|g" README.md
      - name: Save Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Guard-Bot"
          git add README.md
          git commit -m "Guard-Bot: Ownership Verified" || echo "Nothing to update"
          git push
