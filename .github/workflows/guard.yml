name: Guard My Profile
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        run: |
          TIME=$(date -u -d "+5 hours +45 minutes" +"%Y-%m-%d %H:%M:%S")
          TEXT="#### 🕒 Verified Original Design: Nirmal Kharal | Updated: $TIME"
          # This finds the secret word and replaces it with your name
          sed -i "s|\[copyright-area\]|$TEXT|g" README.md
      - name: Save Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Guard-Bot"
          git add README.md
          git commit -m "Guard-Bot: Ownership Verified" || echo "No changes"
          git push
