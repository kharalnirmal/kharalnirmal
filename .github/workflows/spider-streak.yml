name: Update Spider Streak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/spider-streak-dark.svg"
      - "assets/spider-streak-light.svg"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test streak calculations
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Render real contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_spider_streak.py

      - name: Save generated images
        run: |
          git add assets/spider-streak-dark.svg assets/spider-streak-light.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Update spider streak'
            git push
          fi
